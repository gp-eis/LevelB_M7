<!doctype html>
<html lang="en-US" translate="no">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>World Bee Day Activity &mdash; Beekeeper</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/reading-week-2-activity.css?v=20260829-1">
</head>
<body class="lesson-page">
  <div class="floaties" aria-hidden="true">
    <span style="top:12%;left:4%;">🐝</span>
    <span style="top:70%;left:94%;">🌼</span>
  </div>

  <main class="page reading-quiz-page">
    <a class="back-link" href="week-2.html">⬅️ World Bee Day</a>

    <header class="reading-quiz-header">
      <h1 class="big-title">🐝 Bee Story Challenge</h1>
      <div class="quiz-intro-row">
        <p class="subtitle">Listen carefully, then choose the right picture!</p>
        <button class="quiz-speaker small" id="intro-speaker" type="button" aria-label="Listen to the activity instructions">🔊</button>
      </div>
    </header>

    <section class="quiz-board" aria-labelledby="question-text">
      <div class="quiz-progress">
        <span id="progress-label">Question 1 of 4</span>
        <span class="progress-dots" id="progress-dots" aria-hidden="true"></span>
      </div>

      <div class="question-card">
        <img class="question-image" id="question-image" src="" alt="">
        <div class="question-copy">
          <span class="question-kicker" id="question-kicker">From the video</span>
          <h2 id="question-text"></h2>
        </div>
        <button class="quiz-speaker" id="question-speaker" type="button" aria-label="Listen to the question">🔊</button>
      </div>

      <div class="answer-grid" id="answer-grid"></div>
      <p class="feedback-line" id="feedback-line" aria-live="polite"></p>
    </section>
  </main>

  <div class="completion-overlay" id="completion-overlay" role="dialog" aria-modal="true" aria-labelledby="completion-title" hidden>
    <div class="completion-card">
      <div class="completion-icon" aria-hidden="true">🏆🐝</div>
      <h2 id="completion-title">Great job!</h2>
      <p>You finished the World Bee Day activity!</p>
      <div class="completion-actions">
        <button class="pill-btn green" id="try-again" type="button">🔄 Try Again</button>
        <a class="pill-btn blue" href="week-2.html">🎬 Back to Reading</a>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/reading-week-2-activity.js?v=20260830-3"></script>
</body>
</html>
