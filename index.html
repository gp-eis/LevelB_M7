<!doctype html>
<html lang="en-US" translate="no">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Language" content="en-US">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6b91c">
  <title>Choose a Week — Beekeeper</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="weekly-selection-page">
  <div class="honeycomb honeycomb--left" aria-hidden="true"></div>
  <div class="honeycomb honeycomb--right" aria-hidden="true"></div>
  <main class="page weekly-selection-content">
    <header class="weekly-selection-header">
      <div class="weekly-selection-title-row">
        <span class="weekly-title-icon" aria-hidden="true">🐝</span>
        <h1 class="big-title">Choose a Week</h1>
        <span class="weekly-title-icon" aria-hidden="true">🍯</span>
      </div>
      <p>Pick a week to learn, read, and play together!</p>
    </header>

    <nav class="week-grid" aria-label="Choose a week">
      <a class="week-card week-orange" href="week-1.html" data-week="1">
        <span class="week-card__inner">
          <span class="week-card__icon"><img src="assets/images/ui/weekly/week-1-beaver-beekeeper-card.png" alt="Beaver GP Friend dressed as a beekeeper and holding a honeycomb frame"></span>
          <strong>Week 1</strong>
          <span class="week-card__title">Do you keep bees?</span>
        </span>
      </a>
      <a class="week-card week-red" href="week-2.html" data-week="2">
        <span class="week-card__inner">
          <span class="week-card__icon"><img src="assets/images/ui/weekly/week-2-queen-bee-card.png" alt="Queen bee wearing a crown and holding a honey-dipper scepter"></span>
          <strong>Week 2</strong>
          <span class="week-card__title">What do bees do?</span>
        </span>
      </a>
      <a class="week-card week-yellow" href="week-3.html" data-week="3">
        <span class="week-card__inner">
          <span class="week-card__icon"><img src="assets/images/ui/weekly/week-3-pollination-card.png" alt="Bee pollinating a flower that helps food grow"></span>
          <strong>Week 3</strong>
          <span class="week-card__title">Why do we need bees?</span>
        </span>
      </a>
      <a class="week-card week-green" href="week-4.html" data-week="4">
        <span class="week-card__inner">
          <span class="week-card__icon"><img src="assets/images/ui/weekly/week-4-langstroth-hive-card.png" alt="Movable-frame beehive associated with Lorenzo Langstroth"></span>
          <strong>Week 4</strong>
          <span class="week-card__title">I am Lorenzo Langstroth.</span>
        </span>
      </a>
    </nav>

  </main>
  <script src="js/main.js"></script>
</body>
</html>
