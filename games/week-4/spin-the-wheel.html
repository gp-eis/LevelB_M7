  <title>Week 4 Spin the Wheel — Beekeeper</title><link rel="stylesheet" href="../../css/styles.css">
  <style>
    body{overflow-x:hidden;background:linear-gradient(180deg,#9cddff 0%,#efffd7 65%,#fff7bf 100%)}.page{min-height:100vh;min-height:100svh;height:auto;padding-top:18px;padding-bottom:12px}.wheel-wrap{position:relative;width:min(500px,58vh,88vw);margin:18px auto 0}.pointer{position:absolute;z-index:3;top:-18px;left:50%;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:38px solid #ef5350;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2));transform:translateX(-50%)}#wheel{position:relative;container-type:inline-size;width:100%;aspect-ratio:1;border:12px solid #fff;border-radius:50%;background:var(--wheel-gradient);box-shadow:0 10px 0 rgba(74,59,82,.15),0 16px 30px rgba(74,59,82,.15);will-change:transform}#wheel::after{content:'🐝';position:absolute;inset:50% auto auto 50%;display:grid;place-items:center;width:76px;height:76px;border:7px solid #fff;border-radius:50%;background:#fff8cf;font-size:2rem;box-shadow:0 4px 10px rgba(74,59,82,.25);transform:translate(-50%,-50%)}.wheel-label{position:absolute;top:var(--label-y);left:var(--label-x);display:grid;place-items:center;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}.wheel-label img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 3px rgba(30,58,95,.3))}#result{min-height:2.1rem;margin-top:12px;color:#458f22;font-size:1.5rem;font-weight:800}.wheel-actions{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px;min-height:64px;margin-top:4px}.wheel-action-btn{min-width:190px;padding:16px 44px;font-size:1.4rem}#spin-btn{background:linear-gradient(180deg,#8bdd5d,#52aa2d);box-shadow:0 5px 0 #347d1c}.stop-btn{background:linear-gradient(180deg,#ff6f6f,#d94343);box-shadow:0 5px 0 #a62929}.wheel-action-btn[hidden]{display:none}.pill-btn:disabled{cursor:not-allowed;filter:grayscale(.35);opacity:.6;transform:none}body.wheel-is-spinning .wheel-actions{position:fixed;z-index:90;left:50%;bottom:max(12px,env(safe-area-inset-bottom));width:min(330px,92vw);min-height:0;margin:0;padding:8px;border:4px solid rgba(255,255,255,.95);border-radius:999px;background:rgba(235,249,255,.97);box-shadow:0 10px 26px rgba(30,58,95,.28);backdrop-filter:blur(8px);transform:translateX(-50%)}body.wheel-is-spinning .wheel-action-btn{width:100%}.selected-area{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;margin:0;padding:20px;background:rgba(38,66,42,.48);backdrop-filter:blur(4px)}.selected-area[hidden]{display:none}.flip-hint{margin:0;padding:9px 20px;border-radius:999px;background:#fff;color:#458f22;font-family:var(--font-friendly);font-weight:700;box-shadow:0 4px 0 rgba(74,59,82,.14)}.word-card{display:block;width:min(350px,88vw);height:min(390px,66vh);margin:0;padding:0;border:0;border-radius:28px;background:transparent;cursor:pointer;perspective:1100px}.selected-area:not([hidden]) .word-card{animation:card-pop .55s cubic-bezier(.34,1.56,.64,1)}.word-card:focus-visible{outline:5px solid #ffd54a;outline-offset:5px}.card-inner{position:relative;display:block;width:100%;height:100%;transition:transform .65s cubic-bezier(.2,.75,.25,1);transform-style:preserve-3d}.word-card.flipped .card-inner{transform:rotateY(180deg)}.card-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;border:8px solid var(--selected-color,#76c93b);border-radius:28px;background:linear-gradient(#fff,#efffdc);box-shadow:0 9px 0 rgba(74,59,82,.16),0 16px 30px rgba(74,59,82,.16);backface-visibility:hidden;-webkit-backface-visibility:hidden}.card-back{transform:rotateY(180deg)}.card-face img{width:100%;height:min(255px,68%);object-fit:contain}.card-front img{height:82%}.card-word{color:#458f22;font-size:clamp(1.35rem,5vw,2rem);font-weight:900}.card-sentence{color:var(--text);font:700 1.25rem/1.25 var(--font-friendly)}.return-btn{background:linear-gradient(180deg,var(--blue),var(--blue-d));box-shadow:0 5px 0 #1b7fae}@keyframes card-pop{from{opacity:0;transform:translateY(35px) scale(.55) rotate(-5deg)}to{opacity:1;transform:translateY(0) scale(1)}}@media(prefers-reduced-motion:reduce){.card-inner{transition:none}.selected-area:not([hidden]) .word-card{animation:none}}@media(max-width:480px){.page{padding-top:12px}.wheel-wrap{width:min(330px,46svh,calc(100vw - 40px));margin-top:12px}#wheel::after{width:62px;height:62px}.wheel-action-btn{min-width:min(230px,78vw);padding:12px 28px;font-size:1.15rem}.word-card{height:min(350px,62vh)}.card-face{padding:16px}.card-sentence{font-size:1.1rem}}@media(max-height:800px){.page{padding-top:7px}header{margin-top:6px!important}header .big-title{font-size:1.85rem!important}header .subtitle{margin-top:3px;font-size:.92rem;line-height:1.15}.wheel-wrap{width:min(430px,52svh,86vw);margin-top:8px}#result{min-height:1.5rem;margin-top:6px;font-size:1.1rem}}
  </style>

<body><div class="floaties" aria-hidden="true"><span style="top:10%;left:4%">🐝</span><span style="top:75%;left:93%">⭐</span></div><main class="page center"><div style="text-align:left"><a class="back-link" href="../index.html?week=4">⬅️ All Games</a></div><header style="margin-top:16px"><h1 class="big-title page-title-with-icon" style="font-size:2.4rem"><img class="page-title-icon" src="../../assets/images/ui/game-wheel.webp" alt="">Spin the Wheel</h1><p class="subtitle">Spin slowly, press stop, then flip your Week 4 card!</p></header><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><div id="wheel" aria-label="Wheel with six Week 4 vocabulary pictures"></div></div><div id="result" role="status" aria-live="polite"></div><div class="wheel-actions"><button class="pill-btn wheel-action-btn" id="spin-btn" type="button">🎡 SPIN!</button><button class="pill-btn wheel-action-btn stop-btn" id="stop-btn" type="button" hidden>🛑 STOP!</button></div><section class="selected-area" id="selected-area" role="dialog" aria-modal="true" aria-label="Selected Week 4 vocabulary card" aria-live="polite" hidden><p class="flip-hint" id="flip-hint">👆 Click the card to flip it!</p><button class="word-card" id="word-card" type="button" aria-pressed="false"><span class="card-inner"><span class="card-face card-front"><img id="front-image" src="" alt=""><span class="card-word" id="card-word"></span></span><span class="card-face card-back"><img id="back-image" src="" alt=""><span class="card-sentence" id="card-sentence"></span></span></span></button><button class="pill-btn return-btn" id="return-btn" type="button">🎡 Back to Wheel</button></section></main><script src="../../js/main.js"></script><script src="../../js/week-4-vocabulary-data.js"></script><script src="../../js/week-4-wheel.js"></script></body></html>
