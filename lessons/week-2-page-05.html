    <section id="lesson-focus" class="card week-2-activity-card" aria-label="Connect each season to how the bee feels">
      <div class="week-2-stage match-game-stage">
        <img class="week-2-background" src="../assets/images/week-2/literacy/page-05-background-v2.png" width="1411" height="1114" decoding="async" alt="How does the bee feel? Connect each season to the matching sentence.">
        <svg class="week-2-match-lines" viewBox="0 0 1412 1114" preserveAspectRatio="none" aria-hidden="true"></svg>

        <div class="week-2-targets" role="group" aria-label="Choose a season picture to connect it">
          <button class="activity-target match-source match-source-spring" type="button" data-season="spring" data-color="#3c9f35" aria-label="Connect spring" aria-pressed="false" disabled></button>
          <button class="activity-target match-source match-source-summer" type="button" data-season="summer" data-color="#f3b51b" aria-label="Connect summer" aria-pressed="false" disabled></button>
          <button class="activity-target match-source match-source-winter" type="button" data-season="winter" data-color="#1769c7" aria-label="Connect winter" aria-pressed="false" disabled></button>
          <button class="activity-target match-source match-source-fall" type="button" data-season="fall" data-color="#f06a24" aria-label="Connect fall" aria-pressed="false" disabled></button>
        </div>

        <button class="match-picture-speaker picture-speaker-spring" type="button" data-season="spring" aria-label="Listen to spring" disabled>🔊</button>
        <button class="match-picture-speaker picture-speaker-summer" type="button" data-season="summer" aria-label="Listen to summer" disabled>🔊</button>
        <button class="match-picture-speaker picture-speaker-winter" type="button" data-season="winter" aria-label="Listen to winter" disabled>🔊</button>
        <button class="match-picture-speaker picture-speaker-fall" type="button" data-season="fall" aria-label="Listen to fall" disabled>🔊</button>

        <div id="week-2-match-card-stack" class="match-card-stack" aria-label="Bee feeling sentences">
          <article class="match-sentence-card" data-season="winter" style="--match-color:#1769c7" role="button" tabindex="-1" aria-label="Match with: The bee feels cold in winter">
            <span class="match-card-dot" aria-hidden="true"></span>
            <p>The bee feels<br><strong>cold in winter.</strong></p>
            <button class="match-card-speaker" type="button" data-season="winter" aria-label="Listen to: The bee feels cold in winter" disabled>🔊</button>
            <span class="match-card-bee match-card-bee-winter" role="img" aria-label="A cold bee shivering in a blue scarf"></span>
          </article>
          <article class="match-sentence-card" data-season="summer" style="--match-color:#f3b51b" role="button" tabindex="-1" aria-label="Match with: The bee feels hot in summer">
            <span class="match-card-dot" aria-hidden="true"></span>
            <p>The bee feels<br><strong>hot in summer.</strong></p>
            <button class="match-card-speaker" type="button" data-season="summer" aria-label="Listen to: The bee feels hot in summer" disabled>🔊</button>
            <img class="match-card-bee" src="../assets/images/week-2/literacy/page-05-bee-summer-v2.png" alt="A hot bee sweating and holding a fan">
          </article>
          <article class="match-sentence-card" data-season="fall" style="--match-color:#f06a24" role="button" tabindex="-1" aria-label="Match with: The bee feels cool in fall">
            <span class="match-card-dot" aria-hidden="true"></span>
            <p>The bee feels<br><strong>cool in fall.</strong></p>
            <button class="match-card-speaker" type="button" data-season="fall" aria-label="Listen to: The bee feels cool in fall" disabled>🔊</button>
            <img class="match-card-bee" src="../assets/images/week-2/literacy/page-05-bee-fall-v2.png" alt="A cool, relaxed bee resting with closed eyes">
          </article>
          <article class="match-sentence-card" data-season="spring" style="--match-color:#3c9f35" role="button" tabindex="-1" aria-label="Match with: The bee feels warm in spring">
            <span class="match-card-dot" aria-hidden="true"></span>
            <p>The bee feels<br><strong>warm in spring.</strong></p>
            <button class="match-card-speaker" type="button" data-season="spring" aria-label="Listen to: The bee feels warm in spring" disabled>🔊</button>
            <img class="match-card-bee" src="../assets/images/week-2/literacy/page-05-bee-spring-v2.png" alt="A warm, cheerful bee holding a pink flower">
