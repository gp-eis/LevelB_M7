</head>
<body class="lesson-page week-2-literacy-body" data-week-two-activity="4">
  <main class="page literacy-shell-page">
    <nav class="top-page-nav" aria-label="Page navigation">
      <a class="back-link" href="week-2-page-03.html#lesson-focus">⬅️ Previous Page</a>
      <span class="page-indicator" aria-current="page">📖 Page 4 of 6</span>
      <a class="back-link next-page-link" href="week-2-page-05.html#lesson-focus">Next Page ➡️</a>
    </nav>
    <a class="literacy-list-link" href="../week-2.html#card-literacy">🏠 Week 2 Home</a>
    <header class="literacy-header">
      <h1 class="big-title week-2-literacy-title">Week 2 — When can I see bees?</h1>
      <nav class="week-tools" aria-label="Week tools">
        <a class="pill-btn orange" href="tpr.html?week=2">🎵 Week Song</a>
        <a class="pill-btn blue" href="flashcards.html?week=2">🃏 Flashcards</a>
      </nav>
    </header>
    <section id="lesson-focus" class="card week-2-activity-card" aria-label="Choose spring, summer, and fall">
      <div class="week-2-stage">
        <img class="week-2-background" src="../assets/images/week-2/literacy/page-04-seasons.png" width="1412" height="1114" decoding="async" alt="In spring, summer, and fall. Circle spring, summer, and fall.">
        <div class="week-2-targets" role="group" aria-label="Circle the three correct seasons">
          <button class="activity-target season-choice season-spring" type="button" data-season="spring" data-correct="true" aria-label="Choose spring" aria-pressed="false" disabled></button>
          <button class="activity-target season-choice season-summer" type="button" data-season="summer" data-correct="true" aria-label="Choose summer" aria-pressed="false" disabled></button>
          <button class="activity-target season-choice season-winter" type="button" data-season="winter" data-correct="false" aria-label="Choose winter" aria-pressed="false" disabled></button>
          <button class="activity-target season-choice season-fall" type="button" data-season="fall" data-correct="true" aria-label="Choose fall" aria-pressed="false" disabled></button>
        </div>

        <button class="season-word-speaker season-word-speaker-spring" type="button" data-season="spring" aria-label="Hear spring" disabled>🔊</button>
        <button class="season-word-speaker season-word-speaker-summer" type="button" data-season="summer" aria-label="Hear summer" disabled>🔊</button>
        <button class="season-word-speaker season-word-speaker-winter" type="button" data-season="winter" aria-label="Hear winter" disabled>🔊</button>
        <button class="season-word-speaker season-word-speaker-fall" type="button" data-season="fall" aria-label="Hear fall" disabled>🔊</button>

        <div id="week-2-seasons-gate" class="week-2-start-layer">
          <button id="week-2-seasons-start" class="week-2-start-button" type="button">▶ Start Activity</button>
        </div>

        <div id="week-2-completion" class="week-2-completion" hidden>
          <div class="week-2-completion-panel">
            <h2>Great job! 🌼</h2>
            <p>Bees can be seen in spring, summer, and fall.</p>
            <div class="week-2-completion-actions">
              <button id="week-2-completion-retry" class="pill-btn blue" type="button">↻ Try Again</button>
              <a class="pill-btn orange" href="week-2-page-05.html#lesson-focus">Next Page ➡️</a>
            </div>
          </div>
        </div>
      </div>
      <p id="week-2-status" class="week-2-status" role="status" aria-live="polite"></p>
      <button id="week-2-restart" class="pill-btn blue week-2-restart" type="button" disabled>↻ Try Again</button>
    </section>
  </main>
  <script src="../js/main.js"></script>
  <script src="../js/week-2-pages.js"></script>
  <script src="../js/literacy-good-job.js"></script>
