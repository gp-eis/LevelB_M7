<body class="lesson-page week-1-bees-body">
  <main class="page literacy-shell-page">

      <nav class="week-tools" aria-label="Week tools">

    <section id="lesson-focus" class="card week-1-bees-card" aria-label="Circle the correct answers about bees">
      <div class="week-1-bees-stage">
        <img class="week-1-bees-background" src="../assets/images/week-1/literacy/page-04-background-optimized.jpg" width="1412" height="1114" decoding="async" alt="Bees make honey. Circle the correct answers.">

        <div class="week-1-bees-hotspots" role="group" aria-label="Choose everything bees do">
          <div class="bee-hotspot protect" data-correct="true" data-label="protect the queen" data-sentence-audio="../assets/audio/week-1/literacy/page-04-sentence-protect-the-queen.mp3">
            <button class="bee-picture-choice" type="button" aria-label="Choose protect the queen" aria-pressed="false"></button>
            <button class="bee-element-speaker" type="button" aria-label="Listen to: protect the queen" data-audio="../assets/audio/week-1/literacy/page-04-element-protect-the-queen.mp3" disabled>🔊</button>
          </div>
          <div class="bee-hotspot collect" data-correct="true" data-label="collect nectar" data-sentence-audio="../assets/audio/week-1/literacy/page-04-sentence-collect-nectar.mp3">

          <div class="bee-hotspot nuts" data-correct="false" data-label="eat nuts">
            <button class="bee-picture-choice" type="button" aria-label="Choose eat nuts" aria-pressed="false"></button>

          <div class="bee-hotspot flowers" data-correct="true" data-label="find flowers" data-sentence-audio="../assets/audio/week-1/literacy/page-04-sentence-find-flowers.mp3">
            <button class="bee-picture-choice" type="button" aria-label="Choose find flowers" aria-pressed="false"></button>
            <button class="bee-element-speaker" type="button" aria-label="Listen to: find flowers" data-audio="../assets/audio/week-1/literacy/page-04-element-eat-nuts.mp3" disabled>🔊</button>
          </div>
          <div class="bee-hotspot hives" data-correct="true" data-label="build hives" data-sentence-audio="../assets/audio/week-1/literacy/page-04-sentence-build-hives.mp3">
            <button class="bee-picture-choice" type="button" aria-label="Choose build hives" aria-pressed="false"></button>
            <button class="bee-element-speaker" type="button" aria-label="Listen to: build hives" data-audio="../assets/audio/week-1/literacy/page-04-element-find-flowers.mp3" disabled>🔊</button>

          <div class="bee-hotspot honey" data-correct="true" data-label="make honey" data-sentence-audio="../assets/audio/week-1/literacy/page-04-sentence-make-honey.mp3">
            <button class="bee-picture-choice" type="button" aria-label="Choose make honey" aria-pressed="false"></button>
            <button class="bee-element-speaker" type="button" aria-label="Listen to: make honey" data-audio="../assets/audio/week-1/literacy/page-04-element-build-hives.mp3" disabled>🔊</button>

      <p id="week-1-bees-status" class="week-1-bees-status" role="status" aria-live="polite">Press Start Activity and listen.</p>
      <button id="week-1-bees-restart" class="pill-btn blue week-1-bees-restart" type="button">↻ Try Again</button>
