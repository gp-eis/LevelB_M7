</head>
<body class="lesson-page week-1-beekeeper-body">
  <main class="page literacy-shell-page">
    <nav class="top-page-nav" aria-label="Page navigation">
      <a class="back-link" href="week-1-page-02.html#lesson-focus">⬅️ Previous Page</a>
      <span class="page-indicator" aria-current="page">📖 Page 3 of 6</span>
      <a class="back-link next-page-link" href="week-1-page-04.html#lesson-focus">Next Page ➡️</a>
    </nav>
    <a class="literacy-list-link" href="../week-1.html#card-literacy">🏠 Week 1 Home</a>

    <header class="literacy-header">
      <h1 class="big-title week-1-beekeeper-title">Week 1 — Do you keep bees?</h1>
      <nav class="week-tools" aria-label="Week tools">
        <a class="pill-btn orange" href="tpr.html?week=1">🎵 Week Song</a>
        <a class="pill-btn blue" href="flashcards.html?week=1">🃏 Flashcards</a>
      </nav>
    </header>

    <section id="lesson-focus" class="card week-1-beekeeper-quiz" aria-label="What do bees do activity">
      <div class="week-1-beekeeper-stage">
        <img class="week-1-beekeeper-background" src="../assets/images/week-1/literacy/page-03-background-optimized.jpg" width="1412" height="1114" decoding="async" alt="What do bees do? Circle the right answer.">
        <div class="week-1-video-window" aria-hidden="true">
          <video id="week-1-beekeeper-video" class="week-1-character-video" playsinline preload="metadata"></video>
        </div>
        <button id="replay-week-1-question" class="week-1-question-speaker" type="button" aria-label="Replay the question and answer choices" disabled>🔊</button>

        <div class="week-1-answer-panel">
          <div class="answer-list" role="radiogroup" aria-label="Choose the beekeeper's job">
            <div class="sentence-choice" role="radio" aria-checked="false" aria-disabled="true" tabindex="-1" data-answer="athlete">
              <span class="choice-circle choice-blue" aria-hidden="true"><span></span></span>
              <span class="choice-text">I am <span class="answer-word">an athlete</span>.</span>
              <button class="sentence-speaker" type="button" aria-label="Listen to: I am an athlete." data-speak="I am an athlete." data-audio="../assets/audio/week-1/literacy/page-03-answer-athlete.mp3" disabled>🔊</button>
            </div>
            <div class="sentence-choice" role="radio" aria-checked="false" aria-disabled="true" tabindex="-1" data-answer="farmer">
              <span class="choice-circle choice-green" aria-hidden="true"><span></span></span>
              <span class="choice-text">I am <span class="answer-word">a farmer</span>.</span>
              <button class="sentence-speaker" type="button" aria-label="Listen to: I am a farmer." data-speak="I am a farmer." data-audio="../assets/audio/week-1/literacy/page-03-answer-farmer.mp3" disabled>🔊</button>
            </div>
            <div class="sentence-choice" role="radio" aria-checked="false" aria-disabled="true" tabindex="-1" data-answer="beekeeper">
              <span class="choice-circle choice-orange" aria-hidden="true"><span></span></span>
              <span class="choice-text">I am <span class="answer-word">a beekeeper</span>.</span>
              <button class="sentence-speaker" type="button" aria-label="Listen to: I am a beekeeper." data-speak="I am a beekeeper." data-audio="../assets/audio/week-1/literacy/page-03-answer-beekeeper.mp3" disabled>🔊</button>
            </div>
          </div>
          <p id="week-1-answer-feedback" class="answer-feedback" role="status" aria-live="polite">Press Start Activity, then listen.</p>
        </div>

        <div id="week-1-beekeeper-start" class="week-1-start-layer">
          <button id="week-1-beekeeper-start-button" class="week-1-start-button" type="button">▶ Start Activity</button>
        </div>

        <div id="week-1-beekeeper-completion" class="activity-completion-overlay" hidden>
          <div class="activity-completion-frame">
            <button id="week-1-beekeeper-completion-close" class="activity-completion-close" type="button" aria-label="Close the celebration">×</button>
            <video id="week-1-beekeeper-good-job-video" class="activity-completion-video" src="../assets/video/shared/solve-the-problem.mp4" playsinline preload="metadata"></video>
            <div class="activity-completion-actions"><button id="week-1-beekeeper-completion-try-again" class="pill-btn blue" type="button">↻ Try Again</button></div>
          </div>
        </div>
      </div>
      <button id="restart-week-1-beekeeper" class="pill-btn blue week-1-restart" type="button">↻ Try Again</button>
    </section>
  </main>
  <script src="../js/main.js"></script>
  <script src="../js/week-1-page-03.js"></script>
</body>
</html>
